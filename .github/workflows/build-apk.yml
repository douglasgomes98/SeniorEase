name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Executar testes
        run: pnpm test

      - name: Verificar tipos
        run: pnpm turbo run typecheck --filter=@senior-ease/mobile...

      - name: Gerar projeto nativo Android
        run: pnpm --filter @senior-ease/mobile exec expo prebuild --platform android --clean

      - name: Compilar APK de release
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: senior-ease-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
